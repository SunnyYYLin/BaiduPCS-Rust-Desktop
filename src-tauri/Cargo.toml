[package]
name = "baidupcs-rust-desktop"
version = "2.2.3"
description = "Desktop client for BaiduPCS-Rust"
authors = ["Sunny"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rust-embed = "8"
mime_guess = "2"
url = "2"

# BaiduPCS-Rust Core
baidu-netdisk-rust = { path = "../upstream/BaiduPCS-Rust/backend" }

# Axum & Web
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
